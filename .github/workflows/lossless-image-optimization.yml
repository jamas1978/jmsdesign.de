name: Lossless image optimization (one time)

on:
  push:
    branches:
      - optimize/lossless-image-assets-20261026
    paths:
      - .github/workflows/lossless-image-optimization.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install lossless image tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libjpeg-turbo-progs optipng python3-pil

      - name: Recompress without changing any pixels or metadata
        shell: bash
        run: |
          /usr/bin/python3 <<'PY'
          from pathlib import Path
          from PIL import Image
          import os, shutil, subprocess, tempfile

          paths = sorted(p for p in Path('assets').rglob('*') if p.is_file() and p.suffix.lower() in ('.jpg', '.jpeg', '.png'))
          saved = []
          skipped = []
          checked = 0

          def image_signature(path):
              with Image.open(path) as im:
                  im.load()
                  # JPEG baseline vs progressive flags describe coding, not the image.
                  info = {k:repr(v) for k,v in im.info.items() if k not in ('progressive', 'progression')}
                  return im.mode, im.size, im.tobytes(), info

          for source in paths:
              checked += 1
              handle, name = tempfile.mkstemp(suffix=source.suffix)
              os.close(handle)
              tmp = Path(name)
              original_size = source.stat().st_size
              try:
                  if source.suffix.lower() in ('.jpg','.jpeg'):
                      subprocess.run(['jpegtran','-copy','all','-optimize','-progressive','-outfile',str(tmp),str(source)],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,timeout=150)
                  else:
                      shutil.copy2(source, tmp)
                      subprocess.run(['optipng','-o2','-preserve','-quiet',str(tmp)],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,timeout=150)
                  if tmp.stat().st_size >= original_size:
                      continue
                  if image_signature(source) != image_signature(tmp):
                      skipped.append((str(source), 'decoded pixels or metadata changed'))
                      continue
                  difference = original_size - tmp.stat().st_size
                  shutil.copyfile(tmp, source)
                  saved.append((str(source), original_size, source.stat().st_size, difference))
              except Exception as exc:
                  skipped.append((str(source), str(exc)[:160]))
              finally:
                  tmp.unlink(missing_ok=True)

          output = [
              '# Lossless image optimization report',
              '',
              'Only smaller images with identical decoded pixel data, color mode, dimensions and preserved image metadata were applied.',
              'All original files remain available in branch `backup/images-before-optimization-20261026` and in Git history.',
              '',
              f'- Images evaluated: **{checked}**',
              f'- Images optimized: **{len(saved)}**',
              f'- Total reduction: **{sum(row[3] for row in saved):,} bytes**',
              '',
              '| Image | Original bytes | Optimized bytes | Savings |',
              '|---|---:|---:|---:|'
          ]
          for path, before, after, delta in saved:
              output.append(f'| `{path}` | {before:,} | {after:,} | {delta:,} |')
          if skipped:
              output.extend(['', '## Unmodified because verification failed or the lossless encoder did not support the file'])
              for path, why in skipped:
                  output.append(f'- `{path}`: {why}')
          Path('LOSSLESS_IMAGE_OPTIMIZATION.md').write_text('\n'.join(output) + '\n', encoding='utf-8')
          print('\n'.join(output[:7]))
          PY

      - name: Commit verified improvements to optimization branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets LOSSLESS_IMAGE_OPTIMIZATION.md
          if git diff --cached --quiet; then
            echo "No lossless improvements found."
          else
            git commit -m "Optimize image files losslessly with pixel and metadata verification"
            git push origin HEAD:optimize/lossless-image-assets-20261026
          fi
