<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<title>JMS E-Mail-Signatur</title>
<style>
  .jms-signature .logo-dark { display:none !important; }
  .jms-signature .logo-light { display:block !important; }

  @media (prefers-color-scheme: dark) {
    .jms-signature .logo-light { display:none !important; }
    .jms-signature .logo-dark { display:block !important; }
    .jms-signature .sig-name,
    .jms-signature .sig-role,
    .jms-signature .sig-phone { color:#ffffff !important; }
    .jms-signature .sig-rule { border-color:#555555 !important; }
  }
</style>
  <link rel="icon" href="../favicon.ico" sizes="any" />
  <link rel="icon" href="../favicon.png" type="image/png" sizes="512x512" />
  <link rel="apple-touch-icon" href="../apple-touch-icon.png" />
</head>
<body style="margin:0;padding:0;background:transparent;">
<table class="jms-signature" role="presentation" cellpadding="0" cellspacing="0" border="0"
       style="border-collapse:collapse;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:1.4;color:#18161c;">
  <tr>
    <td style="padding:0 0 12px 0;">
      <a href="https://jmsdesign.de" target="_blank" style="display:inline-block;text-decoration:none;border:0;">
        <img class="logo-light"
             src="https://jmsdesign.de/assets/signature/jms-logo-light-email.png"
             width="105" alt="JMS"
             style="display:block;width:105px;height:auto;border:0;outline:none;">
        <img class="logo-dark"
             src="https://jmsdesign.de/assets/signature/jms-logo-dark-email.png"
             width="105" alt="JMS"
             style="display:none;width:105px;height:auto;border:0;outline:none;">
      </a>
    </td>
  </tr>
  <tr>
    <td class="sig-name" style="padding:0;color:#18161c;font-size:14px;line-height:1.3;font-weight:700;">
      Jan Marko Schneider
    </td>
  </tr>
  <tr>
    <td class="sig-role" style="padding:1px 0 10px 0;color:#18161c;font-size:13px;line-height:1.35;">
      Creative Director · Creative Lead
    </td>
  </tr>
  <tr>
    <td class="sig-rule" style="width:250px;padding:0 0 9px 0;border-top:1px solid #d8d8d8;"></td>
  </tr>
  <tr>
    <td style="padding:0 0 1px 0;">
      <a href="https://jmsdesign.de" target="_blank"
         style="color:#ce2d78;text-decoration:underline;text-underline-offset:2px;">jmsdesign.de</a>
    </td>
  </tr>
  <tr>
    <td class="sig-phone" style="padding:0 0 1px 0;color:#18161c;">
      +49 (0) 178 899 11 00
    </td>
  </tr>
  <tr>
    <td style="padding:0 0 1px 0;">
      <a href="mailto:schneider@jmsdesign.de"
         style="color:#ce2d78;text-decoration:underline;text-underline-offset:2px;">schneider@jmsdesign.de</a>
    </td>
  </tr>
  <tr>
    <td style="padding:0;">
      <a href="https://www.linkedin.com/in/jan-marko-schneider-1001b715b/" target="_blank"
         style="color:#ce2d78;text-decoration:underline;text-underline-offset:2px;">LinkedIn</a>
    </td>
  </tr>
</table>
</body>
</html>
